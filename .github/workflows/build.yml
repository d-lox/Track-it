name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/assets --save-dev

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r css www/ 2>/dev/null || true
          cp *.png www/
          if [ -f Index.html ]; then cp Index.html www/index.html; fi
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f mainfest.json ]; then cp mainfest.json www/manifest.json; fi

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          # This creates the icon folders and uses Yes.png to build the app icon
          mkdir -p assets
          cp Yes.png assets/icon-only.png
          cp Yes.png assets/icon-foreground.png
          cp Yes.png assets/icon-background.png
          npx capacitor-assets generate --android

      - name: Sync Web Code to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackIt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
