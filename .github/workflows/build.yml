name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r css www/
          cp *.png www/
          
          # Smartly handle uppercase Index.html or lowercase index.html
          if [ -f Index.html ]; then cp Index.html www/index.html; fi
          if [ -f index.html ]; then cp index.html www/index.html; fi
          
          # Smartly handle the typo 'mainfest.json' or correct 'manifest.json'
          if [ -f manifest.json ]; then cp manifest.json www/; fi
          if [ -f mainfest.json ]; then cp mainfest.json www/manifest.json; fi
          if [ -f Manifest.json ]; then cp Manifest.json www/manifest.json; fi

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Code to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackIt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
