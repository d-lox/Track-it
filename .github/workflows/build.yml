name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      # THIS IS THE NEW FIX: Copying your web files into the 'www' folder
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp index.html manifest.json Yes.png No.png www/
          cp -r css www/

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Web Code to Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackIt-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
